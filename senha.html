
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="senha.css">
     <link rel="stylesheet" href="tela-nova.html">

</head>
<body>

    <div class="container">

        <h1>Recuperar Senha</h1>

        <p class="descricao">
            Digite o seu e-mail cadastrado e nós enviaremos
            um link para você redefinir sua senha.
        </p>

        <form>
            <div class="form-control">
                <label for="email">Email</label>
                <input type="email" id="email"
                placeholder="Digite seu email" required>
            </div>

             <div class="form-control">
                <label for="email">Confirmar email</label>
                <input type="email" id="email"
                placeholder="Confirme seu email" required>
            </div>
              <div class="form-control">
                <label for="senha">Telefone</label>
                <input type="telefone" id="telefone"
                placeholder="Digite seu número de telefone" required>
            </div>


        
            

            <div class="form-control">
                <label for="senha">senha:</label>
                <input type="senha" id="senha"
                placeholder="Digite sua nova senha" required>
            </div>
             <div class="form-control">
                <label for="senha">confirme sua senha:</label>
                <input type="senha" id="senha"
                placeholder="Digite sua senha novamente" required>
            </div>


            <button type="submit">Enviar</button>

        </form>

        <p class="voltar">
            <a href="tela-nova.html">Voltar para o login</a>
        </p>

    </div>

</body>
</html>
